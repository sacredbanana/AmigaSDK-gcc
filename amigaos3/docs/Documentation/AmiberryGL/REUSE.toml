version = 1
SPDX-PackageName = "amiberry-gl-sdk"
SPDX-PackageSupplier = "Dimitris Panokostas <midwan@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/BlitterStudio/amiberry-gl-sdk"

# Steffen Haeuser's minigl.library framework files (MiniGL_Library_68k). He
# licensed his copyright in them under zlib in addition to the Hyperion
# MiniGL licence on 2026-10-15.
[[annotations]]
path = [
    "minigl/client/**",
    "minigl/include/libraries/minigl.h",
    "minigl/include/proto/minigl.h",
    "minigl/include/clib/minigl_protos.h",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Steffen Haeuser"
SPDX-License-Identifier = "LicenseRef-Hyperion-MiniGL OR Zlib"

# The same, with the Amiberry MINIGL_DISPATCH_ABI_TYPES switch, offered on
# the same terms.
[[annotations]]
path = "minigl/include/libraries/minigl_dispatch.h"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2025-2026 Steffen Haeuser", "2026 Dimitris Panokostas"]
SPDX-License-Identifier = "LicenseRef-Hyperion-MiniGL OR Zlib"

# ladislawv's ogles2 and ogles3 public interface files, MIT upstream (the
# LICENSE file in each directory).
[[annotations]]
path = ["ogles/ogles2-interface/**", "ogles/ogles3-interface/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 R-Typer and Ladislawv"
SPDX-License-Identifier = "MIT"

# Khronos platform header without an SPDX line (MIT-style permission text).
[[annotations]]
path = "ogles/include/KHR/khrplatform.h"
precedence = "aggregate"
SPDX-FileCopyrightText = "2008-2018 The Khronos Group Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".gitattributes", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dimitris Panokostas"
SPDX-License-Identifier = "MIT"
